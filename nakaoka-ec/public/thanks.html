<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文完了 | 中岡商会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/ec.css">
</head>

<body>
    <header class="ec-header">
        <div class="header-inner">
            <a href="/" class="ec-logo">NAKAOKA <span>SYOUKAI</span></a>
        </div>
    </header>

    <main class="thanks-container">
        <div class="thanks-card">
            <div class="thanks-icon">✓</div>
            <h1>ご注文ありがとうございます</h1>
            <p class="thanks-message">ご注文内容を確認後、決済用リンクをメールでお送りいたします。<br>通常1営業日以内にご連絡いたします。</p>
            <div class="order-id">
                注文番号: <strong id="order-id-display">---</strong>
            </div>
            <a href="/" class="back-to-shop-btn">ショップに戻る</a>
        </div>
    </main>

    <footer class="ec-footer">
        <p>&copy; 2026 中岡商会 All Rights Reserved.</p>
    </footer>

    <script>
        // Display order ID from URL params
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');
        if (orderId) {
            document.getElementById('order-id-display').textContent = orderId;
        }
    </script>
</body>

</html>
