<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 | 中岡商会 管理パネル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/ec.css">
</head>

<body>
    <header class="ec-header">
        <div class="header-inner">
            <a href="/" class="ec-logo">NAKAOKA <span>SYOUKAI</span></a>
            <nav class="ec-nav">
                <a href="/mypage.html" class="nav-link">マイページ</a>
                <button id="logout-btn" class="nav-link logout-link">ログアウト</button>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <h1>商品管理</h1>

        <!-- 商品追加フォーム -->
        <section class="mypage-section" id="add-product-section">
            <div class="section-header">
                <h2>新規商品を追加</h2>
                <button class="edit-btn" id="toggle-add-form">+ 追加</button>
            </div>

            <div id="add-form-wrap" style="display:none;">
                <form id="product-form">
                    <div class="form-group">
                        <label for="p-name">商品名 <span class="required">*</span></label>
                        <input type="text" id="p-name" required placeholder="例: アリミノ クオライン 280">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="p-price">価格 (税込) <span class="required">*</span></label>
                            <input type="number" id="p-price" required placeholder="2480" min="0">
                        </div>
                        <div class="form-group">
                            <label for="p-stock">在庫数</label>
                            <input type="number" id="p-stock" value="50" min="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="p-category">カテゴリ <span class="required">*</span></label>
                            <input type="text" id="p-category" required placeholder="例: クオライン" list="category-list">
                            <datalist id="category-list"></datalist>
                        </div>
                        <div class="form-group">
                            <label for="p-jan">JANコード</label>
                            <input type="text" id="p-jan" placeholder="4901275014807">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="p-image">画像URL</label>
                        <input type="url" id="p-image" placeholder="https://...">
                    </div>
                    <div id="product-error" class="auth-error" style="display:none;"></div>
                    <div id="product-success" class="auth-success" style="display:none;"></div>
                    <div class="form-actions">
                        <button type="button" class="cancel-btn" id="cancel-add">キャンセル</button>
                        <button type="submit" class="submit-btn submit-btn-sm">
                            <span class="btn-text">商品を登録</span>
                            <span class="btn-loading" style="display:none;">登録中...</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 商品一覧 -->
        <section class="mypage-section">
            <h2>登録済み商品 <span id="product-count" class="product-count-badge">0</span></h2>
            <div id="product-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>読み込み中...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="ec-footer">
        <p>&copy; 2026 中岡商会 All Rights Reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 認証ガード
            const user = await Auth.requireAuth();

            // ── 商品一覧読み込み ──
            async function loadProducts() {
                const listEl = document.getElementById('product-list');
                const countEl = document.getElementById('product-count');
                try {
                    const snapshot = await db.collection('products').orderBy('category').get();
                    const products = [];
                    const categoriesSet = new Set();
                    const seenNames = new Set();

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        products.push({ id: doc.id, ...data });
                        if (data.category) categoriesSet.add(data.category);
                    });

                    countEl.textContent = products.length;

                    // カテゴリ datalist
                    const datalist = document.getElementById('category-list');
                    datalist.innerHTML = '';
                    categoriesSet.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        datalist.appendChild(opt);
                    });

                    if (products.length === 0) {
                        listEl.innerHTML = '<p class="empty-orders">商品が登録されていません。</p>';
                        return;
                    }

                    // 重複チェック用
                    const duplicates = new Map();
                    products.forEach(p => {
                        const key = p.name;
                        if (!duplicates.has(key)) duplicates.set(key, []);
                        duplicates.get(key).push(p.id);
                    });

                    let html = '';
                    products.forEach(p => {
                        const isDup = duplicates.get(p.name) && duplicates.get(p.name).length > 1;
                        html += `
                            <div class="admin-product-card ${isDup ? 'dup-warning' : ''}">
                                <div class="admin-product-img">
                                    ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : '<span class="no-img-sm">📷</span>'}
                                </div>
                                <div class="admin-product-info">
                                    <div class="admin-product-name">${p.name} ${isDup ? '<span class="dup-badge">重複</span>' : ''}</div>
                                    <div class="admin-product-meta">
                                        <span>¥${(p.price || 0).toLocaleString()}</span>
                                        <span>在庫: ${p.stock ?? '-'}</span>
                                        <span class="admin-category-tag">${p.category || '-'}</span>
                                    </div>
                                </div>
                                <div class="admin-product-actions">
                                    <button class="delete-product-btn" data-id="${p.id}" data-name="${p.name}">削除</button>
                                </div>
                            </div>
                        `;
                    });
                    listEl.innerHTML = html;

                    // 削除ボタン
                    listEl.querySelectorAll('.delete-product-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            if (!confirm(`「${btn.dataset.name}」を削除しますか？`)) return;
                            try {
                                await db.collection('products').doc(btn.dataset.id).delete();
                                loadProducts();
                            } catch (err) {
                                alert('削除失敗: ' + err.message);
                            }
                        });
                    });

                } catch (err) {
                    console.error('商品一覧取得エラー:', err);
                    listEl.innerHTML = '<p class="empty-orders">商品の取得に失敗しました。</p>';
                }
            }

            // ── フォーム表示トグル ──
            const toggleBtn = document.getElementById('toggle-add-form');
            const formWrap = document.getElementById('add-form-wrap');
            toggleBtn.addEventListener('click', () => {
                formWrap.style.display = formWrap.style.display === 'none' ? 'block' : 'none';
                toggleBtn.textContent = formWrap.style.display === 'none' ? '+ 追加' : '− 閉じる';
            });
            document.getElementById('cancel-add').addEventListener('click', () => {
                formWrap.style.display = 'none';
                toggleBtn.textContent = '+ 追加';
            });

            // ── 商品追加 ──
            document.getElementById('product-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errorEl = document.getElementById('product-error');
                const successEl = document.getElementById('product-success');
                const submitBtn = e.target.querySelector('.submit-btn');
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                submitBtn.disabled = true;
                submitBtn.querySelector('.btn-text').style.display = 'none';
                submitBtn.querySelector('.btn-loading').style.display = 'inline';

                try {
                    const newProduct = {
                        name: document.getElementById('p-name').value.trim(),
                        price: parseInt(document.getElementById('p-price').value, 10),
                        stock: parseInt(document.getElementById('p-stock').value, 10) || 0,
                        category: document.getElementById('p-category').value.trim(),
                        jan: document.getElementById('p-jan').value.trim(),
                        imageUrl: document.getElementById('p-image').value.trim(),
                        visible: true,
                        caseJan: '',
                        caseQty: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    // 重複チェック
                    const existing = await db.collection('products')
                        .where('name', '==', newProduct.name).get();
                    if (!existing.empty) {
                        errorEl.textContent = `「${newProduct.name}」は既に登録されています。`;
                        errorEl.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.querySelector('.btn-text').style.display = 'inline';
                        submitBtn.querySelector('.btn-loading').style.display = 'none';
                        return;
                    }

                    await db.collection('products').add(newProduct);
                    successEl.textContent = `「${newProduct.name}」を登録しました。`;
                    successEl.style.display = 'block';
                    e.target.reset();
                    document.getElementById('p-stock').value = '50';
                    loadProducts();
                    setTimeout(() => successEl.style.display = 'none', 3000);
                } catch (err) {
                    errorEl.textContent = '登録に失敗しました: ' + err.message;
                    errorEl.style.display = 'block';
                }
                submitBtn.disabled = false;
                submitBtn.querySelector('.btn-text').style.display = 'inline';
                submitBtn.querySelector('.btn-loading').style.display = 'none';
            });

            // ── ログアウト ──
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await Auth.logout();
                window.location.href = '/';
            });

            // Init
            loadProducts();
        });
    </script>
</body>

</html>
