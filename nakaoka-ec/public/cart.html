<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文手続き | 中岡商会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/ec.css">
    <style>
        .address-selector {
            margin-bottom: 1.5rem;
        }

        .address-card {
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }

        .address-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow);
        }

        .address-card.selected {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.04);
        }

        .address-card.selected::after {
            content: '✓';
            position: absolute;
            top: 0.5rem;
            right: 0.75rem;
            background: var(--primary);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .address-card-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .address-card-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .address-card-detail {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.15rem;
        }

        .address-default-badge {
            display: inline-block;
            font-size: 0.6rem;
            background: var(--primary);
            color: #fff;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        .add-address-btn {
            width: 100%;
            padding: 0.6rem;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            background: none;
            color: var(--text-light);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            margin-bottom: 0.5rem;
        }

        .add-address-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .new-address-form {
            display: none;
        }

        .new-address-form.active {
            display: block;
        }

        .order-notes {
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <header class="ec-header">
        <div class="header-inner">
            <a href="/" class="ec-logo">NAKAOKA <span>SYOUKAI</span></a>
            <a href="/" class="nav-link">← ショップに戻る</a>
        </div>
    </header>

    <main class="checkout-container">
        <h1>注文手続き</h1>

        <!-- Cart Summary -->
        <section class="checkout-cart">
            <h2>注文内容</h2>
            <div id="checkout-items"></div>
            <div class="checkout-total" style="flex-direction:column;gap:0.3rem;">
                <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
                    <span>小計</span>
                    <span id="checkout-subtotal">¥0</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:0.85rem;">
                    <span>送料</span>
                    <span id="checkout-shipping">¥0</span>
                </div>
                <div id="shipping-offer" style="font-size:0.75rem;color:var(--primary);padding:0.3rem 0;"></div>
                <div
                    style="display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding-top:0.3rem;border-top:1px solid var(--border-light);">
                    <span>合計（税込・送料込）</span>
                    <span id="checkout-total-price">¥0</span>
                </div>
            </div>
            <details style="margin-top:0.5rem;">
                <summary style="font-size:0.75rem;color:var(--text-light);cursor:pointer;text-decoration:underline;">
                    送料について</summary>
                <table style="width:100%;font-size:0.72rem;margin-top:0.3rem;border-collapse:collapse;">
                    <tr style="background:#f7fafc;">
                        <th style="padding:0.3rem;text-align:left;border:1px solid var(--border-light);">注文金額</th>
                        <th style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);">送料</th>
                    </tr>
                    <tr>
                        <td style="padding:0.3rem;border:1px solid var(--border-light);">¥20,000以上</td>
                        <td
                            style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);color:#48bb78;font-weight:600;">
                            無料</td>
                    </tr>
                    <tr>
                        <td style="padding:0.3rem;border:1px solid var(--border-light);">¥15,000〜¥19,999</td>
                        <td style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);">¥2,200</td>
                    </tr>
                    <tr>
                        <td style="padding:0.3rem;border:1px solid var(--border-light);">¥10,000〜¥14,999</td>
                        <td style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);">¥1,600</td>
                    </tr>
                    <tr>
                        <td style="padding:0.3rem;border:1px solid var(--border-light);">¥5,000〜¥9,999</td>
                        <td style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);">¥1,200</td>
                    </tr>
                    <tr>
                        <td style="padding:0.3rem;border:1px solid var(--border-light);">¥5,000未満</td>
                        <td style="padding:0.3rem;text-align:right;border:1px solid var(--border-light);">¥880</td>
                    </tr>
                </table>
            </details>
        </section>

        <!-- Shipping Address Selection -->
        <section class="checkout-form">
            <h2>配送先を選択</h2>
            <div class="address-selector" id="address-selector">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>読み込み中...</p>
                </div>
            </div>

            <button type="button" class="add-address-btn" id="toggle-new-address">
                + 新しい配送先を追加
            </button>

            <!-- New Address Form -->
            <div class="new-address-form" id="new-address-form">
                <div class="form-group">
                    <label for="addr-label">配送先ラベル <span class="required">*</span></label>
                    <input type="text" id="addr-label" placeholder="例: 本店 / 2号店" required>
                </div>
                <div class="form-group">
                    <label for="addr-company">サロン名 / 会社名</label>
                    <input type="text" id="addr-company" placeholder="例: ヘアサロン LUXE">
                </div>
                <div class="form-group">
                    <label for="addr-name">受取人名 <span class="required">*</span></label>
                    <input type="text" id="addr-name" placeholder="例: 中川 俊樹" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="addr-phone">電話番号 <span class="required">*</span></label>
                        <input type="tel" id="addr-phone" placeholder="090-1234-5678" required>
                    </div>
                    <div class="form-group">
                        <label for="addr-zip">郵便番号</label>
                        <input type="text" id="addr-zip" placeholder="123-4567">
                    </div>
                </div>
                <div class="form-group">
                    <label for="addr-address">住所 <span class="required">*</span></label>
                    <input type="text" id="addr-address" placeholder="東京都港区..." required>
                </div>
                <div id="addr-error" class="auth-error" style="display:none;"></div>
                <div id="addr-success" class="auth-success" style="display:none;"></div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancel-new-address">キャンセル</button>
                    <button type="button" class="submit-btn submit-btn-sm" id="save-new-address">
                        <span class="btn-text">保存して選択</span>
                        <span class="btn-loading" style="display:none;">保存中...</span>
                    </button>
                </div>
            </div>

            <!-- Notes -->
            <div class="order-notes">
                <div class="form-group">
                    <label for="notes">備考</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="配送日時指定など"></textarea>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:0.8rem;">
                <label style="display:flex;align-items:flex-start;gap:0.5rem;font-size:0.85rem;color:var(--text-mid);cursor:pointer;">
                    <input type="checkbox" id="agree-terms" style="margin-top:0.2rem;">
                    <span>注文内容・配送条件を確認し、発注に同意します</span>
                </label>
            </div>

            <button type="button" class="submit-btn" id="submit-order" disabled>
                <span class="btn-text">注文を確定する</span>
                <span class="btn-loading" style="display:none;">送信中...</span>
            </button>
        </section>
    </main>

    <footer class="ec-footer">
        <p>&copy; 2026 中岡商会 All Rights Reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/postal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.requireAuth();
            const profile = await Auth.getUserProfile(user.uid);
            let selectedAddress = null;
            let allAddresses = [];
            const submitBtn = document.getElementById('submit-order');
            const agreeTermsEl = document.getElementById('agree-terms');

            function updateSubmitState() {
                const hasItems = Cart.getAll().length > 0;
                submitBtn.disabled = !selectedAddress || !hasItems || !agreeTermsEl.checked;
            }

            // ── Postal code auto-fill for new address ──
            PostalCode.bind('addr-zip', 'addr-address');

            // ── Shipping calculation ──
            function calcShipping(subtotal) {
                if (subtotal >= 20000) return 0;
                if (subtotal >= 15000) return 2200;
                if (subtotal >= 10000) return 1600;
                if (subtotal >= 5000) return 1200;
                return 880;
            }

            // ── Render cart summary ──
            function renderCheckoutSummary() {
                const checkoutItems = document.getElementById('checkout-items');
                const items = Cart.getAll();
                if (items.length === 0) {
                    checkoutItems.innerHTML = '<p>カートが空です。<a href="/">ショップに戻る</a></p>';
                    return;
                }
                const subtotal = Cart.getTotal();
                const shipping = calcShipping(subtotal);
                const total = subtotal + shipping;

                checkoutItems.innerHTML = items.map(item => `
                <div class="checkout-item">
                    <span class="checkout-item-name">${item.name} × ${item.qty}</span>
                    <span class="checkout-item-price">¥${(item.price * item.qty).toLocaleString()}</span>
                </div>
            `).join('');

                document.getElementById('checkout-subtotal').textContent = `¥${subtotal.toLocaleString()}`;
                document.getElementById('checkout-shipping').textContent = shipping === 0 ? '無料' : `¥${shipping.toLocaleString()}`;
                document.getElementById('checkout-shipping').style.color = shipping === 0 ? '#48bb78' : '';
                document.getElementById('checkout-shipping').style.fontWeight = shipping === 0 ? '700' : '400';
                document.getElementById('checkout-total-price').textContent = `¥${total.toLocaleString()}`;

                // Free shipping offer
                const offerEl = document.getElementById('shipping-offer');
                if (shipping === 0) {
                    offerEl.innerHTML = '🎉 <span style="color:#48bb78;font-weight:600;">送料無料です！</span>';
                } else {
                    const diff = 20000 - subtotal;
                    offerEl.innerHTML = `あと <span style="color:var(--primary);font-weight:700;">¥${diff.toLocaleString()}</span> で<span style="font-weight:600;">送料無料</span>！`;
                }
            }

            // ── Load addresses ──
            async function loadAddresses() {
                const selectorEl = document.getElementById('address-selector');
                try {
                    const snap = await db.collection('users').doc(user.uid)
                        .collection('addresses').orderBy('isDefault', 'desc').get();
                    allAddresses = [];
                    snap.forEach(doc => allAddresses.push({ id: doc.id, ...doc.data() }));

                    // If no addresses exist, auto-create one from profile
                    if (allAddresses.length === 0 && profile && profile.address) {
                        const defaultAddr = {
                            label: profile.company || '本店',
                            company: profile.company || '',
                            name: profile.name || '',
                            phone: profile.phone || '',
                            zip: profile.zip || '',
                            address: profile.address || '',
                            isDefault: true,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        const ref = await db.collection('users').doc(user.uid)
                            .collection('addresses').add(defaultAddr);
                        allAddresses.push({ id: ref.id, ...defaultAddr });
                    }

                    renderAddresses();
                } catch (err) {
                    selectorEl.innerHTML = '<p class="empty-orders">配送先の取得に失敗しました。</p>';
                }
            }

            function renderAddresses() {
                const selectorEl = document.getElementById('address-selector');
                if (allAddresses.length === 0) {
                    selectorEl.innerHTML = '<p style="color:var(--text-light);font-size:0.85rem;">配送先が登録されていません。下のボタンから追加してください。</p>';
                    selectedAddress = null;
                    updateSubmitState();
                    return;
                }

                // Auto-select default or first
                if (!selectedAddress) {
                    selectedAddress = allAddresses.find(a => a.isDefault) || allAddresses[0];
                }

                selectorEl.innerHTML = allAddresses.map(addr => {
                    const isSelected = selectedAddress && selectedAddress.id === addr.id;
                    return `
                    <div class="address-card ${isSelected ? 'selected' : ''}" data-id="${addr.id}">
                        <div class="address-card-label">
                            ${addr.label || '配送先'}
                            ${addr.isDefault ? '<span class="address-default-badge">デフォルト</span>' : ''}
                        </div>
                        <div class="address-card-name">${addr.company ? addr.company + ' / ' : ''}${addr.name || '-'}</div>
                        <div class="address-card-detail">〒${addr.zip || '-'} ${addr.address || '-'}</div>
                        <div class="address-card-detail">TEL: ${addr.phone || '-'}</div>
                    </div>`;
                }).join('');

                updateSubmitState();

                // Click to select
                selectorEl.querySelectorAll('.address-card').forEach(card => {
                    card.addEventListener('click', () => {
                        selectedAddress = allAddresses.find(a => a.id === card.dataset.id);
                        renderAddresses();
                    });
                });
            }

            agreeTermsEl.addEventListener('change', updateSubmitState);

            async function enqueueLineNotification(orderId, orderData) {
                try {
                    const configSnap = await db.collection('config').doc('site').get();
                    const config = configSnap.exists ? configSnap.data() : {};
                    if (!config.lineChannelAccessToken || !config.lineUserId) return;

                    const itemsText = orderData.items
                        .map(i => `・${i.name} × ${i.qty} = ¥${(i.price * i.qty).toLocaleString()}`)
                        .join('\n');

                    const message = [
                        '【新規注文】',
                        `注文番号: ${orderId.substring(0, 8)}`,
                        `顧客名: ${orderData.name}${orderData.company ? `（${orderData.company}）` : ''}`,
                        '',
                        '商品:',
                        itemsText,
                        '',
                        `小計: ¥${(orderData.subtotal || 0).toLocaleString()}`,
                        `送料: ${orderData.shipping === 0 ? '無料' : `¥${(orderData.shipping || 0).toLocaleString()}`}`,
                        `合計: ¥${(orderData.total || 0).toLocaleString()}`,
                        '',
                        `配送先: ${orderData.address}`,
                        `メール: ${orderData.email}`,
                        `電話: ${orderData.phone}`
                    ].join('\n');

                    await db.collection('lineNotifications').add({
                        orderId,
                        message,
                        status: 'pending',
                        source: 'cart',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.warn('LINE通知キュー追加エラー:', err);
                }
            }

            // ── New address form toggle ──
            const toggleNewAddr = document.getElementById('toggle-new-address');
            const newAddrForm = document.getElementById('new-address-form');
            toggleNewAddr.addEventListener('click', () => {
                const isOpen = newAddrForm.classList.contains('active');
                newAddrForm.classList.toggle('active');
                toggleNewAddr.textContent = isOpen ? '+ 新しい配送先を追加' : '− キャンセル';
            });
            document.getElementById('cancel-new-address').addEventListener('click', () => {
                newAddrForm.classList.remove('active');
                toggleNewAddr.textContent = '+ 新しい配送先を追加';
            });

            // ── Save new address ──
            document.getElementById('save-new-address').addEventListener('click', async () => {
                const label = document.getElementById('addr-label').value.trim();
                const company = document.getElementById('addr-company').value.trim();
                const name = document.getElementById('addr-name').value.trim();
                const phone = document.getElementById('addr-phone').value.trim();
                const zip = document.getElementById('addr-zip').value.trim();
                const address = document.getElementById('addr-address').value.trim();
                const errEl = document.getElementById('addr-error');
                const sucEl = document.getElementById('addr-success');
                errEl.style.display = sucEl.style.display = 'none';

                if (!label || !name || !phone || !address) {
                    errEl.textContent = '必須項目を入力してください。';
                    errEl.style.display = 'block';
                    return;
                }

                const btn = document.getElementById('save-new-address');
                btn.disabled = true;
                btn.querySelector('.btn-text').style.display = 'none';
                btn.querySelector('.btn-loading').style.display = 'inline';

                try {
                    const newAddr = {
                        label, company, name, phone, zip, address,
                        isDefault: allAddresses.length === 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    const ref = await db.collection('users').doc(user.uid)
                        .collection('addresses').add(newAddr);

                    selectedAddress = { id: ref.id, ...newAddr };
                    allAddresses.push(selectedAddress);
                    renderAddresses();

                    // Reset form
                    newAddrForm.classList.remove('active');
                    toggleNewAddr.textContent = '+ 新しい配送先を追加';
                    document.getElementById('addr-label').value = '';
                    document.getElementById('addr-company').value = '';
                    document.getElementById('addr-name').value = '';
                    document.getElementById('addr-phone').value = '';
                    document.getElementById('addr-zip').value = '';
                    document.getElementById('addr-address').value = '';

                    sucEl.textContent = `「${label}」を追加しました。`;
                    sucEl.style.display = 'block';
                    setTimeout(() => sucEl.style.display = 'none', 3000);
                } catch (err) {
                    errEl.textContent = '保存に失敗しました: ' + err.message;
                    errEl.style.display = 'block';
                }
                btn.disabled = false;
                btn.querySelector('.btn-text').style.display = 'inline';
                btn.querySelector('.btn-loading').style.display = 'none';
            });

            // ── Submit order ──
            document.getElementById('submit-order').addEventListener('click', async () => {
                if (!selectedAddress) { alert('配送先を選択してください。'); return; }
                if (!agreeTermsEl.checked) { alert('注文同意にチェックしてください。'); return; }
                const items = Cart.getAll();
                if (items.length === 0) { alert('カートが空です。'); return; }

                submitBtn.disabled = true;
                submitBtn.querySelector('.btn-text').style.display = 'none';
                submitBtn.querySelector('.btn-loading').style.display = 'inline';

                try {
                    const subtotal = Cart.getTotal();
                    const shipping = calcShipping(subtotal);
                    const orderData = {
                        userId: user.uid,
                        company: selectedAddress.company || '',
                        name: selectedAddress.name || '',
                        email: profile?.email || user.email,
                        phone: selectedAddress.phone || '',
                        zip: selectedAddress.zip || '',
                        address: selectedAddress.address || '',
                        shippingLabel: selectedAddress.label || '',
                        notes: document.getElementById('notes').value,
                        items: items.map(i => ({
                            productId: i.id,
                            name: i.name,
                            price: i.price,
                            qty: i.qty
                        })),
                        subtotal: subtotal,
                        shipping: shipping,
                        total: subtotal + shipping,
                        status: '未処理',
                        paymentStatus: '未決済',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    const docRef = await db.collection('orders').add(orderData);
                    enqueueLineNotification(docRef.id, orderData);
                    Cart.clear();
                    window.location.href = `/thanks.html?id=${docRef.id}`;
                } catch (err) {
                    console.error('注文エラー:', err);
                    alert('注文の送信に失敗しました。もう一度お試しください。');
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.btn-text').style.display = 'inline';
                    submitBtn.querySelector('.btn-loading').style.display = 'none';
                }
            });

            // ── Init ──
            renderCheckoutSummary();
            loadAddresses();
            updateSubmitState();
        });
    </script>
</body>

</html>
