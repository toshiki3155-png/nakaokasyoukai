<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAN重複クリーンアップ</title>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
        }

        h1 {
            color: #6c5ce7;
            font-size: 1.3rem;
        }

        .status {
            padding: 0.5rem;
            margin: 0.3rem 0;
            border-radius: 6px;
            font-size: 0.82rem;
        }

        .ok {
            background: #c6f6d5;
            color: #276749;
        }

        .ng {
            background: #fed7d7;
            color: #c53030;
        }

        .warn {
            background: #fefcbf;
            color: #b7791f;
        }

        .info {
            background: #bee3f8;
            color: #2b6cb0;
        }

        button {
            background: #6c5ce7;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            font-family: inherit;
        }

        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        button.danger {
            background: #fc8181;
        }

        p {
            color: #718096;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <h1>🔧 JAN重複クリーンアップ</h1>
    <p>同じJANコードで登録されている商品を検出し、重複分を削除します。<br>
        各JANコードにつき最初に登録された1件を残し、それ以降の重複を削除します。</p>
    <button onclick="scanDuplicates()" id="scan-btn">① まずスキャン（削除はしない）</button>
    <button onclick="deleteDuplicates()" id="delete-btn" class="danger" disabled>② 重複を削除する</button>
    <div id="log"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script>
        let duplicatesToDelete = [];

        async function scanDuplicates() {
            const log = document.getElementById('log');
            log.innerHTML = '<div class="status info">スキャン中...</div>';

            // ログインチェック
            const user = firebase.auth().currentUser;
            if (!user) {
                log.innerHTML = '<div class="status ng">⚠️ ログインしていません。先に<a href="/login.html">ログイン</a>してください。</div>';
                return;
            }

            try {
                const snap = await db.collection('products').get();
                const janMap = new Map(); // JAN → [{ id, name, createdAt }]
                let noJanCount = 0;

                snap.forEach(doc => {
                    const d = doc.data();
                    if (!d.jan || d.jan.trim() === '') { noJanCount++; return; }
                    if (!janMap.has(d.jan)) janMap.set(d.jan, []);
                    janMap.get(d.jan).push({ id: doc.id, name: d.name, jan: d.jan });
                });

                duplicatesToDelete = [];
                let html = `<div class="status info">📊 全${snap.size}件の商品をスキャン（JANなし: ${noJanCount}件）</div>`;

                let foundDups = 0;
                janMap.forEach((items, jan) => {
                    if (items.length > 1) {
                        foundDups++;
                        html += `<div class="status warn">⚠️ JAN「${jan}」に${items.length}件の重複:`;
                        items.forEach((item, i) => {
                            if (i === 0) {
                                html += `<br>&nbsp;&nbsp;✓ 残す: ${item.name} (${item.id})`;
                            } else {
                                html += `<br>&nbsp;&nbsp;✗ 削除: ${item.name} (${item.id})`;
                                duplicatesToDelete.push(item);
                            }
                        });
                        html += '</div>';
                    }
                });

                if (foundDups === 0) {
                    html += '<div class="status ok">✓ JAN重複はありません。クリーンな状態です！</div>';
                } else {
                    html += `<div class="status ng">🗑️ 削除対象: ${duplicatesToDelete.length}件</div>`;
                    document.getElementById('delete-btn').disabled = false;
                }

                log.innerHTML = html;
            } catch (err) {
                log.innerHTML = `<div class="status ng">✗ エラー: ${err.message}</div>`;
            }
        }

        async function deleteDuplicates() {
            if (duplicatesToDelete.length === 0) { alert('削除対象がありません。'); return; }
            if (!confirm(`${duplicatesToDelete.length}件の重複商品を削除します。よろしいですか？`)) return;

            const log = document.getElementById('log');
            let html = log.innerHTML;
            html += '<div class="status info">削除中...</div>';
            log.innerHTML = html;

            let deleted = 0;
            for (const item of duplicatesToDelete) {
                try {
                    await db.collection('products').doc(item.id).delete();
                    html += `<div class="status ok">✓ 削除完了: ${item.name} (JAN: ${item.jan})</div>`;
                    deleted++;
                } catch (err) {
                    html += `<div class="status ng">✗ 削除失敗: ${item.name} — ${err.message}</div>`;
                }
                log.innerHTML = html;
            }

            html += `<div class="status ok"><strong>完了！ ${deleted}/${duplicatesToDelete.length}件を削除しました。</strong></div>`;
            log.innerHTML = html;
            document.getElementById('delete-btn').disabled = true;
            duplicatesToDelete = [];
        }
    </script>
</body>

</html>
