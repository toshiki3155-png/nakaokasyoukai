<!-- Cart System Code (Mobile 3-Column & Continue Shopping Button) -->
<!-- コードエディターで貼り付けてください -->

<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: { red: "#D32F2F", black: "#333333", gray: "#F5F5F5" }
                },
                fontFamily: { sans: ['"Noto Sans JP"', "sans-serif"], },
            }
        }
    }
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

<div id="nakaoka-cart-app" class="relative w-full min-h-screen bg-white font-sans text-brand-black pb-24">

    <!-- Header -->
    <header
        class="sticky top-0 left-0 w-full z-40 bg-white border-b border-gray-200 shadow-sm h-16 flex items-center px-4 md:px-6 justify-between">
        <span class="text-sm md:text-xl font-bold tracking-tighter">NAKAOKA ORDER SYSTEM</span>
        <div class="relative cursor-pointer p-2" onclick="toggleCartModal()">
            <span class="material-icons-outlined text-brand-red text-3xl">shopping_cart</span>
            <span id="cart-badge"
                class="absolute top-0 right-0 bg-brand-black text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
        </div>
    </header>

    <!-- Product List -->
    <main class="max-w-6xl mx-auto px-2 md:px-6 py-6 md:py-10">
        <h1 class="text-xl md:text-2xl font-bold mb-6 border-l-4 border-brand-red pl-4 ml-2">商品一覧</h1>

        <!-- Changed to grid-cols-3 for mobile as requested -->
        <div id="product-grid" class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-2 md:gap-6">
            <!-- Products injected via JS -->
        </div>
    </main>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="toggleCartModal()"></div>
        <div class="absolute right-0 top-0 h-full w-full md:w-[480px] bg-white shadow-2xl flex flex-col transform transition-transform duration-300 translate-x-full"
            id="cart-panel">
            <!-- Modal Header -->
            <div class="h-16 border-b border-gray-100 flex items-center justify-between px-6 bg-brand-red text-white">
                <h2 class="font-bold flex items-center"><span
                        class="material-icons-outlined mr-2">shopping_bag</span>現在のカート</h2>
                <button onclick="toggleCartModal()"
                    class="text-white hover:text-gray-200 material-icons-outlined">close</button>
            </div>

            <!-- Cart Items -->
            <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- JS fills this -->
            </div>

            <!-- Footer -->
            <div class="border-t border-gray-100 p-6 bg-gray-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-sm font-bold text-gray-500">合計金額 (税込)</span>
                    <span id="cart-total" class="text-2xl font-black text-brand-red">¥0</span>
                </div>

                <div class="flex flex-col gap-3">
                    <button onclick="openCheckoutModal()" id="checkout-btn"
                        class="w-full bg-brand-black text-white font-bold py-4 rounded-sm hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                        disabled>
                        注文情報入力へ進む
                    </button>

                    <!-- "Continue Shopping" Button Added -->
                    <button onclick="toggleCartModal()"
                        class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-3 rounded-sm hover:bg-gray-50 transition-colors text-sm">
                        買い物を続ける
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Logic Modal -->
    <div id="checkout-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="bg-white w-full max-w-lg relative z-10 rounded-sm shadow-xl p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-6 border-b pb-2">お客様情報入力</h2>

            <form id="order-form" onsubmit="generateMail(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">サロン名 <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="salon-name" required
                            class="w-full border border-gray-300 p-3 rounded-sm focus:border-brand-red focus:outline-none"
                            placeholder="例: Hair Salon NAKAOKA">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ご担当者名 <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="customer-name" required
                            class="w-full border border-gray-300 p-3 rounded-sm focus:border-brand-red focus:outline-none"
                            placeholder="例: 山田 太郎">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">電話番号 <span
                                class="text-red-500">*</span></label>
                        <input type="tel" id="phone" required
                            class="w-full border border-gray-300 p-3 rounded-sm focus:border-brand-red focus:outline-none"
                            placeholder="例: 03-1234-5678">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">配送先ご住所 <span
                                class="text-red-500">*</span></label>
                        <textarea id="address" required rows="3"
                            class="w-full border border-gray-300 p-3 rounded-sm focus:border-brand-red focus:outline-none"
                            placeholder="〒000-0000 大阪府..."></textarea>
                    </div>
                </div>

                <div class="mt-8 flex gap-4">
                    <button type="button" onclick="closeCheckoutModal()"
                        class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-sm hover:bg-gray-300">戻る</button>
                    <button type="submit"
                        class="flex-1 bg-brand-red text-white font-bold py-3 rounded-sm hover:bg-red-700 shadow-lg">メール作成</button>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    // Product Data
    const products = [
        { id: 1, name: "T280", price: 1034, listPrice: 1815, jan: "4901275014807", category: "アルカリ" },
        { id: 2, name: "T-C250", price: 1034, listPrice: 1815, jan: "4901275015118", category: "アルカリ" },
        { id: 3, name: "T-C80", price: 1034, listPrice: 1815, jan: "4901275014852", category: "アルカリ" },
        { id: 4, name: "CA-T200", price: 1241, listPrice: 2178, jan: "4901275015125", category: "アルカリ" },
        { id: 5, name: "CA-C130", price: 1241, listPrice: 2178, jan: "4901275014838", category: "アルカリ" },
        { id: 6, name: "CA-C0", price: 1241, listPrice: 2178, jan: "4901275014869", category: "アルカリ" },
        { id: 7, name: "アフタークリーム", price: 1310, listPrice: 2299, jan: "4901275014883", category: "処理剤" },
        { id: 8, name: "アジャスト0", price: 1379, listPrice: 2420, jan: "4901275014869", category: "処理剤" },
        { id: 9, name: "πmore STRAIGHT 2剤", price: 0, listPrice: 0, priceDisplay: "お問合せ", jan: "4582406483329", category: "2剤" }
    ];

    let cart = {};

    document.addEventListener('DOMContentLoaded', () => {
        renderProducts();
    });

    function renderProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map(product => {
            const priceHtml = product.price > 0
                ? `<div class="flex flex-col md:flex-row md:items-baseline"><span class="text-sm md:text-xl font-bold text-brand-red">¥${product.price.toLocaleString()}</span> <span class="text-[10px] md:text-xs text-gray-400 line-through md:ml-2">¥${product.listPrice.toLocaleString()}</span></div>`
                : '<span class="text-sm md:text-xl font-bold text-gray-500">お問合せ</span>';

            // Shorten category name for mobile fitting if needed
            const cat = product.category;

            return `
        <div class="bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow p-2 md:p-6 flex flex-col justify-between h-full">
          <div>
            <span class="text-[9px] md:text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 md:px-2 md:py-1 rounded mb-1 md:mb-2 inline-block truncate max-w-full">${cat}</span>
            <h3 class="text-xs md:text-lg font-bold mb-1 md:mb-2 text-brand-black tracking-tight leading-tight line-clamp-2 min-h-[2.5em] md:min-h-0">${product.name}</h3>
            <p class="text-[8px] md:text-xs text-gray-400 mb-2 md:mb-4 font-mono truncate">JAN:${product.jan}</p>
          </div>
          <div class="flex flex-col md:flex-row items-center justify-between mt-2 pt-2 md:pt-4 border-t border-gray-50 gap-2">
            <div class="w-full md:w-auto text-left">${priceHtml}</div>
            <button onclick="addToCart(${product.id})" class="bg-brand-black text-white p-1 md:p-2 rounded md:rounded-full hover:bg-brand-red transition-colors w-full md:w-10 h-8 md:h-10 flex items-center justify-center shadow-sm">
              <span class="material-icons-outlined text-sm md:text-base mr-1 md:mr-0 md:hidden">add_shopping_cart</span>
              <span class="text-xs font-bold md:hidden">追加</span>
              <span class="material-icons-outlined text-sm hidden md:block">add</span>
            </button>
          </div>
        </div>
      `;
        }).join('');
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const itemIds = Object.keys(cart);

        if (itemIds.length === 0) {
            container.innerHTML = '<div class="h-full flex flex-col items-center justify-center"><span class="material-icons-outlined text-6xl text-gray-200 mb-4">shopping_basket</span><p class="text-gray-400 text-center text-sm">カートは空です。<br>商品一覧から追加してください。</p></div>';
            document.getElementById('checkout-btn').disabled = true;
            document.getElementById('cart-total').innerText = '¥0';
            document.getElementById('cart-badge').classList.add('hidden');
            return;
        }

        let total = 0;
        let totalQty = 0;

        container.innerHTML = itemIds.map(id => {
            const product = products.find(p => p.id == id);
            const qty = cart[id];
            const subtotal = product.price * qty;
            total += subtotal;
            totalQty += qty;

            return `
        <div class="flex items-start justify-between bg-white border-b border-gray-50 pb-4 mb-4 animate-[fadeIn_0.2s_ease-out]">
          <div class="flex-1 mr-4">
            <h4 class="font-bold text-sm text-brand-black mb-1">${product.name}</h4>
            <p class="text-xs text-gray-400 mb-2">単価: ¥${product.price.toLocaleString()}</p>
            <div class="flex items-center bg-gray-50 border border-gray-200 rounded w-max">
              <button onclick="updateQty(${id}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-white text-gray-600 active:bg-gray-200">-</button>
              <span class="w-10 text-center font-bold text-sm bg-white h-8 flex items-center justify-center border-x border-gray-200">${qty}</span>
              <button onclick="updateQty(${id}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-white text-gray-600 active:bg-gray-200">+</button>
            </div>
          </div>
          <div class="text-right flex flex-col justify-between h-full">
             <span class="font-bold text-brand-red">¥${subtotal.toLocaleString()}</span>
             <button onclick="removeItem(${id})" class="text-xs text-gray-400 hover:text-red-500 underline mt-3">削除</button>
          </div>
        </div>
      `;
        }).join('');

        document.getElementById('cart-total').innerText = '¥' + total.toLocaleString();
        document.getElementById('checkout-btn').disabled = false;

        const badge = document.getElementById('cart-badge');
        badge.innerText = totalQty;
        badge.classList.remove('hidden');
    }

    function addToCart(id) {
        if (!cart[id]) cart[id] = 0;
        cart[id]++;
        renderCart();

        const modal = document.getElementById('cart-modal');
        if (modal.classList.contains('hidden')) toggleCartModal();
    }

    function updateQty(id, change) {
        if (cart[id] + change <= 0) {
            if (confirm('この商品をカートから削除しますか？')) {
                delete cart[id];
            } else {
                return;
            }
        } else {
            cart[id] += change;
        }
        renderCart();
    }

    function removeItem(id) {
        if (confirm('カートから削除しますか？')) {
            delete cart[id];
            renderCart();
        }
    }

    function toggleCartModal() {
        const modal = document.getElementById('cart-modal');
        const panel = document.getElementById('cart-panel');
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            renderCart(); // update view
            setTimeout(() => panel.classList.remove('translate-x-full'), 10);
        } else {
            panel.classList.add('translate-x-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    }

    function openCheckoutModal() {
        toggleCartModal();
        document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
        document.getElementById('checkout-modal').classList.add('hidden');
        toggleCartModal();
    }

    function generateMail(e) {
        e.preventDefault();
        const salonName = document.getElementById('salon-name').value;
        const name = document.getElementById('customer-name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;

        let itemsText = "";
        let total = 0;
        Object.keys(cart).forEach(id => {
            const product = products.find(p => p.id == id);
            const qty = cart[id];
            const subtotal = product.price * qty;
            total += subtotal;
            itemsText += `・${product.name}  x ${qty}個  (¥${subtotal.toLocaleString()})\n`;
        });

        const subject = `【注文】商品オーダー (${salonName}様)`;
        const body = `
中岡商会 御中

以下の通り注文いたします。

【ご注文者情報】
--------------------------------------------------
サロン名： ${salonName}
お名前　： ${name}
電話番号： ${phone}
ご住所　： ${address}
--------------------------------------------------

【注文内容】
${itemsText}

--------------------------------------------------
合計金額 (税込)： ¥${total.toLocaleString()} ~
--------------------------------------------------

※価格は参考価格です。正式な請求書にて確定いたします。
`.trim();

        window.location.href = `mailto:info@b-pilot.jp?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
</script>
